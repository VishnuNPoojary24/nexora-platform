services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nexora_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-nexora} ${MINIO_ROOT_PASSWORD:-nexora_dev_password}
      && mc mb --ignore-existing local/${MINIO_BUCKET:-nexora-attachments}"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm-nexora.json:/opt/keycloak/data/import/realm-nexora.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    environment:
      AI_SERVICE_NAME: nexora-ai
      AI_PROVIDER: placeholder
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm ci --include=optional && npm run dev --workspace=apps/api"
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-nexora_dev_auth_secret_nexora_dev_auth_secret}
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-nexora}
      DATABASE_USER: ${POSTGRES_USER:-nexora}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-nexora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-nexora_dev_password}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-nexora}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-nexora_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-nexora-attachments}
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/nexora
      KEYCLOAK_CLIENT_ID: nexora-web
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - npm_cache:/root/.npm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm ci --include=optional && npm run dev --workspace=apps/web -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - npm_cache:/root/.npm
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  keycloak_data:
  npm_cache:
